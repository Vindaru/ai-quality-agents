    error: 'ElementNotInteractableException: element not interactable'
  - id: S05
    label: automation_issue
    test_name: test_send_sms_helper
    error: 'TypeError: send_sms() missing 1 required positional argument: ''language'''
    stack: File tests/helpers/sms.py, line 12, in send_sms
