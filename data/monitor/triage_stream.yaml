# Simulated production traffic for monitoring the Failure-Triage agent: six nightly runs of
# failures as they would arrive from CI, ten a night. Days 1-3 are drawn from the same kinds of
# failures as the golden set. Days 4-5 add failure patterns the agent has never seen (the test
# runners moved to Kubernetes and the UI suite to Playwright). Day 6 is a bad deploy: mostly
# product bugs. `label` and `drift` are the answer key: the monitor never reads them, they are
# used only to score the monitor afterwards. Hostnames use the reserved .test TLD.
days:
- day: 1
  note: normal nightly run
  drift: none
  failures:
  - id: S01
    label: environment
    test_name: test_send_referral_sms
    error: 'requests.exceptions.HTTPError: 503 Server Error: Service Unavailable for url: https://sms-gateway.test/v1/messages'
    logs:
    - 2026-03-01T10:00:01Z WARN sms-gateway health check failing
  - id: S02
    label: environment
    test_name: test_export_outreach_report
    error: 'OSError: [Errno 28] No space left on device: ''/tmp/report.csv'''
  - id: S03
    label: environment
    test_name: test_create_food_bank_referral
    error: 'HTTPError: 504 Gateway Timeout from referral-service.test'
  - id: S04
