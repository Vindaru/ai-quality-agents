# Release runs for stage 3: each one is a candidate build of the demo referral service (correct,
# or with one planted bug from BUGS) in a test environment (healthy, or one fault from FAULTS).
# The generated suite from stage 2 runs on each, and every failure is triaged. Ground truth is
# derived from what was injected (see src/aiq/execution.py), so these need no hand labels.
runs:
  - {id: R1, bug: null, fault: null, note: "clean candidate: only a broken test should fail"}
  - {id: R2, bug: unknown_referral_200, fault: null, note: "regression in the partner API"}
  - {id: R3, bug: no_consent_audit, fault: null, note: "regression in consent auditing"}
  - {id: R4, bug: expired_token_accepted, fault: null, note: "security regression"}
  - {id: R5, bug: null, fault: gateway_down, note: "test environment gateway down"}
  - {id: R6, bug: null, fault: seed_missing, note: "seed job loaded no members"}
  - {id: R7, bug: no_e164, fault: null, note: "regression no generated test catches"}
