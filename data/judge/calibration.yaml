# Calibration set for the scenario judge (src/aiq/evals/judge.py).
# Each item is one generated scenario and the acceptance criterion it claims to cover, labeled by
# a human reviewer on the judge's four checks. The verdict is "pass" only when all four are true.
# The judge is trusted only while its agreement with these labels stays above the gate in
# data/thresholds.yaml. All data is synthetic.
#
# Where the items come from:
#   source: mock   a scenario the Requirements-to-Test agent produced on the golden stories
#   source: human  written by a reviewer to probe a specific judge weakness (a correct scenario
#                  in different words, a wrong behaviour, a wrong tag, a vague Then, an injection)
#
# Label review: the labels were drafted on 2026-11-19 and must be reviewed by the repo owner.
# Change a label only with a note saying why; a relabel moves the agreement metrics, which is
# the point. Keep the set roughly balanced between pass and fail.
reviewed_by: pending
items:
  # ------------------------------------------------------------------ agent outputs that pass
  - id: J02
    source: mock
    criterion: "When a member's preferred language is Spanish, the referral SMS is sent in Spanish."
    scenario: {scenario: "When a member's preferred language is Spanish, the referral SMS is sent in Spanish", test_layer: API, tags: [positive],
               steps: ["Given a synthetic member record exists", "When a member's preferred language is Spanish", "Then the referral SMS is sent in Spanish"]}
    human: {tests_criterion: true, concrete_action: true, observable_outcome: true, tag_matches: true}
