  - {id: Q14, kind: simple, question: "What error does a phone number with letters return?", gold: ["D02#2"], key_facts: ["422", "phone_invalid"]}
  # ------------------------------------------------------------------ multi: needs two chunks
  - {id: Q15, kind: multi, question: "When no partner food bank is near the member, where does the referral go and who is told?", gold: ["D03#2"], key_facts: ["regional food line", "care coordinator"]}
  - {id: Q16, kind: multi, question: "Can a member get a same-day ride, and what does it need?", gold: ["D04#2"], key_facts: ["urgent care", "approval"]}
  - {id: Q17, kind: multi, question: "What happens after a member opts out, and where is it recorded?", gold: ["D01#2", "D01#3"], key_facts: ["no further outreach", "consent audit"]}
  - {id: Q18, kind: multi, question: "What happens when a partner uses an expired token, and how long do tokens last?", gold: ["D07#1", "D07#2"], key_facts: ["401", "90 days"]}
  - {id: Q19, kind: multi, question: "What language is a message sent in if there is no template, and what is logged?", gold: ["D05#2"], key_facts: ["English", "translation request"]}
  - {id: Q20, kind: multi, question: "When can outreach texts be sent and how many per week?", gold: ["D11#1"], key_facts: ["9 AM", "8 PM", "3"]}
  # ------------------------------------------------------------------ unanswerable: must refuse
  - {id: Q21, kind: unanswerable, question: "What is the copay for a specialist visit?", gold: [], key_facts: []}
  - {id: Q22, kind: tricky, question: "Can a member book a ride to the food bank on a weekend?", gold: ["D04#3"], key_facts: ["does not cover"], note: "rides to food banks are not covered at all; the right answer says so"}
